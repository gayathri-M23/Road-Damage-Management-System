<!DOCTYPE html>
<html>
<head>
    <title>Report Damage</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

<div class="login-box">

    <h1>Road Damage Management System</h1>

    <h2>Report Road Damage</h2>

    <input type="text" placeholder="Location">

    <select>
        <option>Select Damage Type</option>
        <option>Pothole</option>
        <option>Road Crack</option>
        <option>Road Break</option>
    </select>

    <br><br>

    <textarea placeholder="Describe the damage" rows="5" cols="40"></textarea>

    <br><br>

    <input type="file">

    <br><br>

    <button>Submit Report</button>

</div>

</body>
</html>
